<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        img.sin-conseguir {
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <img id="medalla" src="/img/medallas/__NUMERO_MEDALLA__.png" />

    <script>
        const miNumero = __NUMERO_MEDALLA__;
        const socket = new WebSocket('ws://localhost:__PUERTO_WEBSOCKET__');
        const imagen = document.getElementById('medalla');

        socket.addEventListener('message', (event) => {
            const datos = JSON.parse(event.data);

            // Por este socket viajan también los datos del equipo. Sin filtrar,
            // datos.medallas sería undefined y "undefined < miNumero" es false,
            // así que la medalla se pintaría en color aunque no la tengas.
            if (datos.tipo !== 'medallas') {
                return;
            }

            if (datos.medallas < miNumero) {
                imagen.classList.add('sin-conseguir');
            } else {
                imagen.classList.remove('sin-conseguir');
            }
        });
    </script>

</body>
</html>
