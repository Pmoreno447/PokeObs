# Empaqueta PokeObs para macOS, Windows y Linux.
#
# - En cada pull request a main: compila las tres plataformas para comprobar
#   que el empaquetado sigue funcionando antes de fusionar.
# - Al subir una etiqueta vX.Y.Z: además publica los paquetes en una Release.
#
# Cada sistema operativo se compila en su propia máquina porque Node SEA solo
# puede inyectar el backend en un binario de Node de la misma plataforma.
name: Empaquetar y publicar

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empaquetar:
    name: Empaquetar (${{ matrix.so }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Si falla una plataforma, las demás siguen: así se ven todos los fallos
      # de una vez.
      fail-fast: false
      matrix:
        include:
          - so: macOS
            runner: macos-latest
          - so: Windows
            runner: windows-latest
          - so: Linux
            runner: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Evita publicar una Release cuya etiqueta no coincide con la versión que
      # llevan dentro los paquetes (por ejemplo, en el Info.plist de macOS).
      - name: Comprobar que la etiqueta coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($VERSION)"
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      # Los binarios de Neutralino no están en el repositorio (.gitignore).
      - name: Descargar binarios de Neutralino
        run: npm run gui:binarios

      - name: Empaquetar
        run: npm run empaquetar

      - name: Guardar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: PokeObs-${{ matrix.so }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  publicar:
    name: Publicar Release
    needs: empaquetar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Reunir los paquetes
        uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*
          generate_release_notes: true
